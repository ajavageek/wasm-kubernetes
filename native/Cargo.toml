[package]
name = "httpbin-native"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["rt", "macros", "net", "time", "io-util"] }
axum = "0.6"
serde = { version = "1.0.226", features = ["derive"] }

[[bin]]
name = "httpbin"
path = "../src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flavor, values("native", "embed", "runtime"))'] }
